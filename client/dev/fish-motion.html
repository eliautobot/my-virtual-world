<!doctype html>
<html><head><meta charset="utf-8"><title>Fishing game — how the fish move</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html, body { margin: 0; height: 100%; background: #0b3a4a; overflow: hidden; font: 14px system-ui, sans-serif; color: #fff; }
#lab { position: absolute; left: 12px; top: 10px; text-shadow: 0 1px 3px #000; font-weight: 600; }
#lab small { display: block; font-weight: 400; opacity: 0.85; }
.side { position: absolute; top: 46px; font-weight: 700; text-shadow: 0 1px 3px #000; }</style>
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
</head><body>
<div id="lab"></div>
<script type="module">
// The lab for render/fish-motion.js (2026-11-14): one fish swimming in clear water, the way the fishing game moves it —
// ?f=<species> &act=swim|fight|shake|dive|leap|held|turn &cmp=1 (the old baked loops on the left, the new swim on the
// right). window.__frame(t) draws the moment t seconds in (frame-exact for capture); without it, it runs live.
import * as THREE from 'three';
import { fishAsset } from '/js/render/fish-models.js';
import { FishMotion } from '/js/render/fish-motion.js';
import { skinnedPack, coatsOf } from '/js/render/fauna-skinned.js';
import { GU } from '/js/render/scene.js';
import { speciesOf } from '/shared/fish-species.js';
const q = new URLSearchParams(location.search); const id = q.get('f') || 'mahi', act = q.get('act') || 'swim', cmp = q.has('cmp');
const len = +(q.get('len') || 1), label = q.get('label');
const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); R.setPixelRatio(1); R.outputColorSpace = THREE.SRGBColorSpace;
R.setSize(innerWidth, innerHeight); R.setScissorTest(true); document.body.appendChild(R.domElement);
const scene = new THREE.Scene(), water = new THREE.Color(act === 'held' || act === 'leap' ? 0x8fc4dc : 0x0f6278);
scene.background = water; if (act !== 'held' && act !== 'leap') scene.fog = new THREE.Fog(water, 2 + len * 3, 10 + len * 9);
scene.add(new THREE.HemisphereLight(0xdff4ff, 0x1d4650, 1.7)); const sun = new THREE.DirectionalLight(0xffffff, 2.0); sun.position.set(2, 8, 3); scene.add(sun);
// a sandy floor (under water) or the sea's surface (a leap) for scale
if (act === 'leap') { const s = new THREE.Mesh(new THREE.PlaneGeometry(200, 200).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x1f6f8f, roughness: 0.25, metalness: 0.1 })); scene.add(s); }
else if (act !== 'held') { const fl = new THREE.Mesh(new THREE.PlaneGeometry(400, 400).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0xc8b98c, roughness: 1 })); fl.position.y = -1.6 - len * 0.8; scene.add(fl);
  const rk = new THREE.MeshStandardMaterial({ color: 0x6f7a6a, roughness: 1 }); for (let i = 0; i < 60; i++) { const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.15 + Math.random() * 0.5 * len, 0), rk); m.position.set((Math.random() - 0.5) * 60, fl.position.y, (Math.random() - 0.5) * 60); scene.add(m); } }
const cam = new THREE.PerspectiveCamera(38, 1, 0.05, 300);
const A = await fishAsset(id);
const coat = coatsOf({}, A)[0], what = { species: id };
const motion = new FishMotion(A, what, coat, scene);
let old = null; if (cmp) { old = skinnedPack(A, 1, scene, 'old', coatsOf({}, A)); }
const name = speciesOf(id)?.name || id;
document.getElementById('lab').innerHTML = `${label || name}<small>${{ swim: 'Swimming', fight: 'On the line: runs, turns, a head-shake, a dive', shake: 'The head-shake', dive: 'Diving', leap: 'A leap', held: 'Held up: still, then a flop', turn: 'Turning' }[act] || act}</small>`;
if (cmp) document.body.insertAdjacentHTML('beforeend', '<div class="side" style="left:12px">Before</div><div class="side" style="left:calc(50% + 12px)">After</div>');

// the moves, as the fight gives them: a place and a mode at t
const from = { x: 0, z: -6 * len };   // (the angler)
function path(t) {
  if (act === 'swim') { const r = 3 * len, a = t * 0.9 / Math.max(0.6, len) * 0.5; return { p: new THREE.Vector3(Math.sin(a) * r, -0.6, Math.cos(a) * r), mode: q.get('mode') || 'cruise', free: true }; }
  if (act === 'turn') { const a = Math.sin(t * 0.9) * 1.6; return { p: new THREE.Vector3(Math.sin(t * 0.6) * 3 * len, -0.6, t * 0.9 * len), mode: 'run' }; }
  if (act === 'shake') return { p: new THREE.Vector3(Math.sin(t * 0.3) * 0.3 * len, -0.5, 0), mode: Math.floor(t / 2.2) % 2 ? 'shake' : 'run' };
  if (act === 'dive') { const u = (t % 5) / 5; return { p: new THREE.Vector3(t * 0.8 * len, -0.4 - Math.sin(u * Math.PI) * 1.4 * len, 0), mode: u < 0.5 ? 'dive' : 'run' }; }
  // a fight: runs off to the side and back, a head-shake, a dive, a rest — moving like the fight's own place does
  const seg = [['run', 3], ['shake', 1.6], ['run', 2.4], ['dive', 2], ['rest', 2], ['toward', 2]];
  let k = t % seg.reduce((a, b) => a + b[1], 0), m = 'run'; for (const [s, d] of seg) { if (k < d) { m = s; break; } k -= d; }
  return { p: new THREE.Vector3(Math.sin(t * 0.55) * 4 * len, -0.5 - (m === 'dive' ? 0.6 * len : 0), 6 * len + Math.cos(t * 0.4) * 2 * len - (m === 'toward' ? k * 0.8 * len : 0)), mode: m };
}
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _turn = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), -Math.PI / 2);
let oldYaw = 0, last = null;
function draw(t) {
  let P, yaw = 0, pitch = 0, roll = 0, mode = 'under', a = {};
  if (act === 'held') { P = new THREE.Vector3(0, 0, 0); mode = 'held'; yaw = Math.PI / 2; a = { flopAt: 3 }; }
  else if (act === 'pose') { P = new THREE.Vector3(0, 0, 0); mode = 'under'; a = { mode: 'run', from: { x: 0, z: -40 } }; }
  else if (act === 'leap') {
    const cyc = 3.2, u0 = (t % cyc) / cyc, x0 = (Math.floor(t / cyc)) * 0;
    if (u0 < 0.55) { const u = u0 / 0.55, h = 0.5 + len * 0.9, dist = Math.min(7, len * 1.3 + h * 0.9), slope = (h + 0.15 * len) * 4 * (1 - 2 * u);
      P = new THREE.Vector3(-dist * 0.45 + dist * u, -0.15 * len + (h + 0.15 * len) * 4 * u * (1 - u), 0); mode = 'air'; yaw = Math.PI / 2; pitch = Math.atan2(slope, dist) * 0.9; roll = 0.12 * Math.sin(u * 5); a = { u }; }
    else { const u = (u0 - 0.55) / 0.45; P = new THREE.Vector3(len * 2 - u * len * 3.5, -0.35 * len, 0); mode = 'under'; a = { mode: 'run', from: { x: -40, z: 0 } }; }
  } else { const g = path(t); P = g.p; a = { mode: g.mode, from: g.free ? null : from }; }
  const s = motion.update(mode, P, yaw, pitch, roll, len, a, t);
  if (q.has('mouth')) { window.__mk ||= (() => { const m = new THREE.Mesh(new THREE.SphereGeometry(0.035 * Math.max(1, len), 12, 8), new THREE.MeshBasicMaterial({ color: 0xff2040, depthTest: false })); m.renderOrder = 9; scene.add(m);
      const lg = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]); const ln = new THREE.Line(lg, new THREE.LineBasicMaterial({ color: 0xffffff })); scene.add(ln); return { m, ln }; })();
    const mo = motion.mouth(); if (mo) { window.__mk.m.position.copy(mo); const g = window.__mk.ln.geometry.attributes.position; g.setXYZ(0, mo.x, mo.y, mo.z); g.setXYZ(1, from.x, 2, from.z); g.needsUpdate = true; } }
  // the old way (the model's baked loops, as the game drew them before): its clip by mode, its rate by mode
  if (old) {
    const m = a.mode || 'run', clip = mode === 'held' ? 0 : mode === 'air' || m === 'shake' ? 2 : 6;
    const rate = mode === 'held' ? 1.2 : (clip === 2 ? 1.5 : m === 'rest' ? 0.6 : m === 'toward' ? 1.6 : 1.25) * (0.8 + 0.4 / Math.max(0.3, len));
    if (last && mode === 'under') { const dx = P.x - last.x, dz = P.z - last.z; if (Math.hypot(dx, dz) > 0.002) oldYaw = Math.atan2(dx, dz); } else if (mode !== 'under') oldYaw = yaw;
    last = P.clone();
    _q.setFromEuler(new THREE.Euler(-(mode === 'under' ? (m === 'dive' ? -0.35 : 0) : pitch), oldYaw, mode === 'air' ? Math.sin((a.u || 0) * 9) * 0.4 : roll, 'YXZ')).multiply(_turn);
    old.begin(); old.put(_m.compose(P, _q, new THREE.Vector3(len, len, len)), 0, 0.3, clip ? rate : 0, clip, 0, null, true); old.end();
  }
  GU.uTime.value = t;
  // the camera: beside it, a little ahead, looking at it
  const c = new THREE.Vector3(s.x, s.y, s.z), back = act === 'held' ? 1.6 * len + 0.3 : act === 'leap' ? 5 * len + 3 : 1.5 * len + 0.7;
  // (the camera beside it, coming round slowly as it turns: it sees the body bend)
  window.__cy = window.__cy == null ? s.yaw + Math.PI / 2 : window.__cy + Math.atan2(Math.sin(s.yaw + Math.PI / 2 - window.__cy), Math.cos(s.yaw + Math.PI / 2 - window.__cy)) * 0.04;
  const side = window.__cy;
  const ca = act === 'held' ? 0 : act === 'leap' ? -Math.PI / 2 + 0.0 : side;
  const W = innerWidth, H = innerHeight;
  const views = cmp ? [[0, W / 2], [W / 2, W / 2]] : [[0, W]];
  views.forEach(([x0, w], i) => {
    motion.mesh.visible = !cmp || i === 1; if (old) old.meshes.forEach(mm => { mm.visible = i === 0 && mm.count > 0; });
    cam.aspect = w / H; cam.updateProjectionMatrix();
    if (act === 'leap') { cam.position.set(0, 0.6 + len * 0.3, 1.5 * len + 1.6); cam.lookAt(0, 0.5 + len * 0.3, 0); }
    else if (act === 'held') { cam.position.set(Math.sin(0.55) * back, 0.45 * back, Math.cos(0.55) * back); cam.lookAt(0, 0, 0); }
    else { const el = +(q.get('el') || 0.75); cam.position.set(c.x + Math.sin(ca) * back * Math.cos(el), c.y + Math.sin(el) * back, c.z + Math.cos(ca) * back * Math.cos(el)); cam.lookAt(c); }
    R.setViewport(x0, 0, w, H); R.setScissor(x0, 0, w, H); R.render(scene, cam);
  });
}
addEventListener('resize', () => R.setSize(innerWidth, innerHeight));
window.__frame = t => draw(t);
window.__ready = true;
if (!q.has('cap')) { const t0 = performance.now(); const loop = () => { draw((performance.now() - t0) / 1000); requestAnimationFrame(loop); }; loop(); }
</script>
</body></html>

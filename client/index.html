<script>
  /* The theme before the first paint (WP1.9, C39): the browser's own copy, so the page never flashes the wrong look.
     A signed-in account's choice replaces it a moment later (js/core/theme.js). */
  (function () {
    try {
      var t = localStorage.getItem('mw.theme'), el = document.documentElement;
      if (t === 'light' || t === 'contrast') el.dataset.theme = t;
      /* and its transparency (0–60 %; High contrast stays solid): js/core/theme.js applyTransparency */
      var a = parseInt(localStorage.getItem('mvw.transparency'), 10);
      if (a > 0 && a <= 60) { el.style.setProperty('--ui-a', (100 - a) + '%'); if (t !== 'contrast') el.classList.add('see-through'); }
    } catch (e) { /* private mode: the default look */ }
  })();
</script>

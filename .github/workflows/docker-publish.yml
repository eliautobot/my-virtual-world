# The ready-made image: every release tag (v2.6.0, …) builds the Dockerfile for 64-bit PCs and ARM machines (Apple
# Silicon, Raspberry Pi), starts it once to check it answers, and publishes it to GitHub's container registry as
# ghcr.io/<this repository>:<version>, :<major>.<minor>, :<major> and :latest. compose.yaml runs :2, so
# `docker compose pull` brings each new release of version 2. (A manual run rebuilds the tag it is started on.)
name: Docker image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: The image's name (lower case, as the registry wants it)
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (ARM builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build for this runner, to check it first
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mvw-check:latest
          build-args: |
            RELEASE_TAG=${{ github.ref_name }}
            RELEASE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start it and wait for it to answer
        run: |
          docker run -d --name mvw-check -p 127.0.0.1:8570:8570 -e MVW_UPDATE_CHECK=off mvw-check:latest
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8570/api/health > health.json 2>/dev/null; then head -c 400 health.json; echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8570/api/health > /dev/null || { docker logs mvw-check | tail -80; exit 1; }
          grep -q '"ok":true' health.json
          docker logs mvw-check | tail -20
          docker rm -f mvw-check

      - name: Log in to GitHub's container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=My Virtual World
            org.opencontainers.image.description=A living 3D city for your AI agents (and you) that you host yourself.
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0

      - name: Build for 64-bit PCs and ARM, and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RELEASE_TAG=${{ github.ref_name }}
            RELEASE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
